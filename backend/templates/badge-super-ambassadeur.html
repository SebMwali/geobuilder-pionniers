<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Badge Super Ambassadeur — {{NOM_COMPLET}}</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:#000; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel','Trajan Pro',Georgia,serif;
  }
  .badge{
    position:relative;
    width: min(95vw, 760px);
    aspect-ratio: 1086 / 1448;
    background-image: url("https://sebmwali.github.io/geobuilder-pionniers/assets/badge-super-ambassadeur-bg.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    container-type: inline-size;
    font-family:'Cinzel',serif;
  }
  .ovl{
    position:absolute;
    color:#3A8FE8;
    text-shadow: 0 0 14px rgba(58,143,232,.55), 0 1px 2px rgba(0,0,0,.7);
    text-transform:uppercase;
    font-weight:700;
  }
  /* Territoire — centré, +20% taille */
  .ovl-territoire{
    top: 62%;
    left: 0; width: 100%;
    text-align:center;
    font-size: 3.6cqw;
    letter-spacing: .18em;
  }
  /* Année — centrée pixel-exact entre "PIONNIER..." (71,3%) et la barre bleue (80,8%) */
  .ovl-annee{
    top: 76%;
    transform: translateY(-50%);
    left: 0; width: 100%;
    text-align:center;
    font-size: 8cqw;
    letter-spacing: .14em;
  }
  /* Nom — centré pixel-exact entre la barre bleue (80,8%) et la pointe de la goutte (84,25%) */
  .ovl-nom{
    top: 82.5%;
    transform: translateY(-50%);
    left: 0; width: 100%;
    text-align:center;
    font-size: 1.9cqw;
    letter-spacing: .14em;
  }
  /* PIO ID — bas droite, discret */
  .ovl-pio{
    right: 9%; bottom: 5%;
    font-size: 1.7cqw;
    letter-spacing: .22em;
    font-weight:600;
  }
</style>
</head>
<body>
  <div class="badge">
    <div class="ovl ovl-territoire">{{TERRITOIRE}}</div>
    <div class="ovl ovl-annee">{{ANNEE}}</div>
    <div class="ovl ovl-nom">{{NOM_COMPLET}}</div>
    <div class="ovl ovl-pio">{{PIO_ID}}</div>
  </div>
</body>
</html>
