<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badge Ambassadeur — Geobuilder</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:#060810;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding: 78px 28px 84px;-webkit-font-smoothing:antialiased;
}
/* Conteneur FIXE 500x667px — même ratio que l'image native */
.wrap{
  position:relative;
  width:700px;
  height:934px;
  flex-shrink:0;
}
.wrap img{
  position:absolute;inset:0;
  width:700px;height:934px;
  display:block;
}
.z{
  position:absolute;
  display:flex;align-items:center;justify-content:center;
  text-align:center;overflow:hidden;
}

.z-pays{
  left:231px;
  top:566px;
  width:238px;
  height:38px;
  font-family:'Cinzel',serif;
  font-size:27px;
  font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:#3A8FE8;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.z-annee{
  left:270px;
  top:699px;
  width:155px;
  height:35px;
  font-family:'Cinzel',serif;
  font-size:25px;
  font-weight:900;letter-spacing:.08em;
  color:#3A8FE8;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.z-pio{
  left:438px;
  top:825px;
  width:213px;
  height:32px;
  font-family:'Cinzel',serif;
  font-size:18px;
  font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(192,200,212,0.65);
  justify-content:flex-end;padding-right:8px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}

.print-btn{
  margin-top:48px;background:rgba(58,143,232,0.1);border:1px solid rgba(58,143,232,0.25);
  color:#3A8FE8;font-family:'Cinzel',serif;font-size:15px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;padding: 20px 39px;border-radius:6px;cursor:pointer;
}
.print-btn:hover{background:rgba(58,143,232,0.2)}

@media print{
  html,body{background:#000;padding:0;margin:0;display:block;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-btn{display:none}
  /* En impression A4 portrait : largeur utile ~794px (96dpi) → ratio */
  .wrap{width:794px;height:1059px}
  .wrap img{width:794px;height:1059px}
  .z-pays{
    left:367px;top:899px;
    width:378px;
    height:59px;
    font-size:43px;
  }
  .z-annee{
    left:430px;top:1110px;
    width:246px;
    height:55px;
    font-size:39px;
  }
  .z-pio{
    left:696px;top:1310px;
    width:337px;
    height:52px;
    font-size:28px;
  }
}
@page{size:portrait;margin:0}
</style>
