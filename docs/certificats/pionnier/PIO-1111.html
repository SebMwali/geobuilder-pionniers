<head>
<meta charset="UTF-8">

<title>Certificat de Pionnier — Geobuilder</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:#060810;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px 60px;-webkit-font-smoothing:antialiased;
}
.wrap{position:relative;width:1054px;height:1493px;flex-shrink:0}
.wrap img{position:absolute;inset:0;width:100%;height:100%;display:block}
.z{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}

/* Écran : gradient chrome */
.z-nom{
  left:120px;top:761px;width:815px;height:90px;
  font-family:'Cinzel',serif;font-size:min(62px,calc(815px / 14));
  font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(180deg,#fff 0%,#c8d0dc 30%,#edf1f5 55%,#9aaab8 80%,#d0d8e0 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  white-space:nowrap;
}
.z-pays{
  left:175px;top:1048px;width:240px;height:48px;
  font-family:'Cinzel',serif;font-size:28px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  background:linear-gradient(135deg,#3A8FE8,#7BC7FF);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.z-annee{
  left:425px;top:1048px;width:200px;height:48px;
  font-family:'Cinzel',serif;font-size:34px;font-weight:700;letter-spacing:.04em;
  background:linear-gradient(135deg,#3A8FE8,#7BC7FF);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.z-pio{
  left:655px;top:1050px;width:220px;height:48px;
  font-family:'Cinzel',serif;font-size:28px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  background:linear-gradient(135deg,#c8d0dc,#edf1f5);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* IMPRESSION : couleurs solides — background-clip non supporté */
@media print{
  html,body{background:#000;padding:0;margin:0;display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-btn{display:none}
  .wrap{width:210mm;height:297mm;position:relative}
  .wrap img{width:100%;height:100%;position:absolute;inset:0}
  .z-nom{
    background:none !important;
    -webkit-text-fill-color:#ffffff !important;
    color:#ffffff !important;
    font-size:52px;
  }
  .z-pays{
    background:none !important;
    -webkit-text-fill-color:#3A8FE8 !important;
    color:#3A8FE8 !important;
  }
  .z-annee{
    background:none !important;
    -webkit-text-fill-color:#3A8FE8 !important;
    color:#3A8FE8 !important;
  }
  .z-pio{
    background:none !important;
    -webkit-text-fill-color:#c8d0dc !important;
    color:#c8d0dc !important;
  }
  /* Recalculer positions en mm (ratio 210mm/1054px = 0.1993) */
  .z-nom  {left:22.6mm;top:152.0mm;width:162.9mm;height:18.0mm;font-size:14mm;white-space:nowrap;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .z-pays {left:33.1mm;top:209.5mm;width:45.4mm;height:9.1mm;font-size:6mm}
  .z-annee{left:80.4mm;top:209.5mm;width:37.9mm;height:9.1mm;font-size:7mm}
  .z-pio  {left:124.1mm;top:209.5mm;width:41.6mm;height:9.1mm;font-size:6mm}
}
@page{size:A4 portrait;margin:0}

.print-btn{
  margin-top:28px;background:rgba(58, 143, 232,0.1);border:1px solid rgba(58, 143, 232,0.25);
  color:#3A8FE8;font-family:'Cinzel',serif;font-size:12px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;padding:12px 32px;
  border-radius:4px;cursor:pointer;
}
.print-btn:hover{background:rgba(58, 143, 232,0.2)}
</style>
