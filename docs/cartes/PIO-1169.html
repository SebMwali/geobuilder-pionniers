<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge Pionnier — Sebastien FUMAZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#0D0D0D; font-family:'Montserrat',-apple-system,Segoe UI,Roboto,sans-serif; color:#fff; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 12px; }
  .container { width:100%; max-width:560px; }

  .badge-wrap {
    position:relative;
    width:100%;
    aspect-ratio: 1024 / 1536;   /* aligné sur l'image fournie */
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(58,143,232,.12);
  }
  .badge-bg {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }
  .overlay { position:absolute; inset:0; pointer-events:none; }

  /* Nom client — entre les deux barres bleues, sous "DE L'EAU DE L'AIR" */
  .nom-client {
    position:absolute;
    top:40.5%;
    left:0; right:0;
    text-align:center;
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    letter-spacing:0.18em;
    font-size:clamp(16px, 3.6vw, 26px);
    color:#ffffff;
    text-transform:uppercase;
    line-height:1.1;
    padding:0 10%;
    text-shadow:0 2px 12px rgba(0,0,0,0.7);
  }

  /* Territoire — sous le pin bleu */
  .territoire {
    position:absolute;
    top:55.5%;
    left:0; right:0;
    text-align:center;
    font-family:'Montserrat',sans-serif;
    font-weight:500;
    letter-spacing:0.30em;
    font-size:clamp(11px, 2.0vw, 14px);
    color:#ffffff;
    text-transform:uppercase;
    text-shadow:0 2px 8px rgba(0,0,0,0.7);
  }

  /* Année — sous "DEPUIS" */
  .annee {
    position:absolute;
    top:69.5%;
    left:0; right:0;
    text-align:center;
    font-family:'Montserrat',sans-serif;
    font-weight:500;
    letter-spacing:0.30em;
    font-size:clamp(13px, 2.4vw, 17px);
    color:#ffffff;
    text-shadow:0 2px 8px rgba(0,0,0,0.7);
  }

  /* QR code — centré dans le carré bleu en bas (zone Earth) */
  .qr-zone {
    position:absolute;
    left:50%;
    top:85%;
    transform:translate(-50%, -50%);
    width:22%;
    aspect-ratio:1/1;
    background:#fff;
    border-radius:4px;
    padding:4px;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto;
  }
  .qr-zone img { width:100%; height:100%; display:block; image-rendering:pixelated; }

  .cta {
    display:block;
    margin:24px auto 0;
    background:#3A8FE8;
    color:#0D0D0D;
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    text-align:center;
    text-decoration:none;
    padding:14px 22px;
    border-radius:10px;
    letter-spacing:0.06em;
    font-size:14px;
    text-transform:uppercase;
    transition:transform .15s ease;
  }
  .cta:hover { transform:translateY(-1px); }
  .meta {
    text-align:center;
    margin-top:14px;
    color:#6b7280;
    font-size:11px;
    letter-spacing:0.20em;
    text-transform:uppercase;
  }
</style>
</head>
<body>

<div class="container">
  <div class="badge-wrap">
    <img class="badge-bg" src="https://sebmwali.github.io/geobuilder-pionniers/assets/badge-pionnier-bg.png" alt="Badge Pionnier Geobuilder">
    <div class="overlay">
      <div class="nom-client">Sebastien FUMAZ</div>
      <div class="territoire">MAYOTTE</div>
      <div class="annee">2026</div>
      <div class="qr-zone">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=0&data=https%3A%2F%2Fsebmwali.github.io%2Fgeobuilder-pionniers%2Fpionniers%2FPIO-1169%2Findex.html" alt="QR code Espace Pionnier">
      </div>
    </div>
  </div>

  <a class="cta" href="https://sebmwali.github.io/geobuilder-pionniers/pionniers/PIO-1169/index.html" target="_blank" rel="noopener">Accéder à mon Espace Pionnier</a>
  <div class="meta">PIO-1169</div>
</div>

</body>
</html>
