name: Keep Pionniers Backend Warm

# Ping le backend toutes les 5 minutes pour eviter le cold start
# (scale-to-zero du pod Emergent => premier appel >10s = timeout SAV)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/health
        run: |
          set -e
          URL="https://pioneer-ecosystem.preview.emergentagent.com/api/health"
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
            echo "Try $i: HTTP $CODE @ $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            if [ "$CODE" = "200" ]; then
              echo "Backend is warm"
              exit 0
            fi
            sleep 5
          done
          echo "Backend not responding after 3 attempts"
          exit 1
